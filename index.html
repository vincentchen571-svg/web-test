<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 3rd Anniversary ❤️</title>
    <style>
        :root {
            --primary-color: #ff7675;
            --secondary-color: #74b9ff;
            --bg-color: #fff5f5;
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #main-card {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { color: #2d3436; margin-bottom: 25px; line-height: 1.4; }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            display: block;
            width: 100%;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,118,117,0.3); }

        #next-btn { background-color: #00b894; margin-top: 20px; }

        .hidden { display: none; }

        .answer-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin: 15px 0;
            border: 3px solid #f1f2f6;
        }

        #feedback { color: #636e72; font-size: 15px; background: #f9f9f9; padding: 10px; border-radius: 10px; }

        /* 回憶頁面樣式 */
        #memory-machine h1 { color: #d63031; margin-bottom: 10px; }
        .heart { font-size: 50px; color: #e17055; animation: beat 1s infinite alternate; }
        @keyframes beat { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

<div id="main-card">
    <div id="start-section">
        <div class="heart">❤️</div>
        <h2>Hi 寶貝！<br>準備好進行三週年挑戰了嗎？</h2>
        <button class="btn" onclick="startQuiz()">點我開始！</button>
    </div>

    <div id="quiz-section" class="hidden">
        <h2 id="question">題目載入中...</h2>
        
        <div id="options-container">
            </div>

        <div id="result-area" class="hidden">
            <img id="answer-img" class="answer-img" src="" alt="我們的回憶">
            <p id="feedback"></p>
            <button id="next-btn" class="btn" onclick="nextQuestion()">點我進入下一題 ➔</button>
        </div>
    </div>

    <div id="memory-machine" class="hidden">
        <div class="heart">💝</div>
        <h1>3rd Anniversary</h1>
        <p>恭喜妳通過考驗！</p>
        <p style="text-align: left; line-height: 1.8; color: #636e72;">
            謝謝妳這三年的陪伴，<br>
            從我們第一次見面到現在，<br>
            每一段回憶對我來說都很珍貴。<br>
            我會一直牽著妳的手走下去的！
        </p>
        <img src="final.jpg" class="answer-img" alt="最後的合照" onerror="this.src='https://via.placeholder.com/400x300?text=Happy+3rd+Anniversary'">
    </div>
</div>

<script>
    // 【你可以修改這裡的題目內容】
    const quizData = [
        {
            q: "去年我們在東京，妳在哪裡買到 Hello Kitty 的？",
            options: ["原宿", "新宿", "上野"],
            ans: 0,
            img: "photo1.jpg", // 放在同一個資料夾的照片檔名
            msg: "✅ 沒錯！妳那天在原宿買到超開心，那個笑容我記得超清楚。"
        },
        {
            q: "我們交往三週年的正確日期是？",
            options: ["2月1日", "2月3日", "2月4日"],
            ans: 2,
            img: "photo2.jpg",
            msg: "✅ 算妳聰明！這題答錯的話我就要哭囉。"
        },
        {
            q: "這張照片是我們在哪裡拍的？", // 提示：可以搭配圖片
            options: ["淡水碼頭", "九份老街", "陽明山"],
            ans: 1,
            img: "photo3.jpg",
            msg: "✅ 對耶！那天雖然下雨，但跟妳一起撐傘逛街超浪漫。"
        }
    ];

    let currentQ = 0;

    function startQuiz() {
        document.getElementById('start-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const data = quizData[currentQ];
        document.getElementById('question').innerText = `Q${currentQ + 1}: ${data.q}`;
        
        // 隱藏結果區，顯示選項區
        document.getElementById('result-area').classList.add('hidden');
        const container = document.getElementById('options-container');
        container.classList.remove('hidden');
        container.innerHTML = ""; 
        
        data.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });
    }

    function checkAnswer(index) {
        const data = quizData[currentQ];
        if (index === data.ans) {
            // 答對了：隱藏選項，顯示結果區
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            
            document.getElementById('feedback').innerText = data.msg;
            // 更新圖片，若圖片不存在則顯示佔位圖
            const imgTag = document.getElementById('answer-img');
            imgTag.src = data.img;
            imgTag.onerror = function() {
                this.src = "https://via.placeholder.com/400x300?text=Memory+Photo";
            };
        } else {
            alert("答錯囉！再給妳一次機會（或是親我一口）😘");
        }
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < quizData.length) {
            showQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('memory-machine').classList.remove('hidden');
    }
</script>

</body>
</html>
