<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 3rd Anniversary ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-color: #ff7675; --error-color: #d63031; --bg-color: #fff5f5; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* 幻燈片容器 */
        #slideshow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; display: none; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; }
        .slide.active { opacity: 1; }
        #slideshow-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); z-index: -1; display: none; }

        /* 主卡片樣式 */
        #main-card { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; position: relative; z-index: 10; transition: all 0.5s ease; }
        
        /* 結尾毛玻璃效果：縮小寬度並稍微下移避免擋臉 */
        .glass-mode { 
            background: rgba(255, 255, 255, 0.15) !important; 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white !important;
            max-width: 360px !important;
            margin-top: 80px !important; 
        }
        .glass-mode p, .glass-mode h1 { text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5); }

        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; margin: 8px; border-radius: 12px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; }
        .hidden { display: none; }
        .answer-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 15px; margin: 15px 0; border: 2px solid #eee; }
        
        #feedback { color: #2ecc71; font-weight: bold; margin-top: 10px; }
        #error-hint { color: var(--error-color); font-weight: bold; margin-top: 10px; min-height: 24px; opacity: 0; transition: opacity 0.3s; }
        .show-error { opacity: 1 !important; }

        .loading-bar-container { background: #eee; height: 6px; border-radius: 3px; margin-top: 15px; overflow: hidden; }
        .loading-bar { height: 100%; background: #fab1a0; width: 0%; transition: width 2.5s linear; }
    </style>
</head>
<body>

<div id="slideshow-container"></div>
<div id="slideshow-overlay"></div>

<div id="main-card">
    <div id="start-section">
        <h2 style="font-size: 24px;">Hi Lily！❤️<br>三週年 20 題大挑戰</h2>
        <p>每一題答對後，都會自動進入下一題喔！</p>
        <button class="btn" onclick="startQuiz()">開始挑戰</button>
    </div>

    <div id="quiz-section" class="hidden">
        <h2 id="question">題目載入中...</h2>
        <img id="question-img" class="answer-img" src="">
        <div id="options-container"></div>
        <p id="error-hint">答錯囉，再想一下！😘</p>
        <div id="result-area" class="hidden">
            <p id="feedback">✅ 太棒了！答對囉！</p>
            <img id="success-img" class="answer-img" src="img/correct.jpg">
            <div class="loading-bar-container">
                <div id="progress" class="loading-bar"></div>
            </div>
            <p style="font-size: 12px; color: #aaa; margin-top: 5px;">即將進入下一題...</p>
        </div>
    </div>

    <div id="memory-machine" class="hidden">
        <h1 style="color: #ff7675;" id="final-title">Happy 3rd Anniversary!</h1>
        <div style="text-align: left; line-height: 1.8;">
            <p>To Lily：</p>
            <p>恭喜妳通過了20題挑戰！</p>
            <p>這三年的點點滴滴，謝謝妳一直都在。</p>
            <p>之後也要繼續甜蜜的邁向第四年呦 ~~~ </p>
            <p style="text-align: right; margin-top: 20px;">Made by 帥氣的 陳煙燻</p>
        </div>
    </div>
</div>

<script>
    const rawQuizData = [
        { q: "這張照片是我們第一次去台南玩的第幾天拍的？", options: ["Day1", "Day2", "Day3"], ans: 0 },
        { q: "這張底片是在哪裡拍的？", options: ["南寮漁港", "大稻埕", "新月沙灣"], ans: 1 },
        { q: "這張照片是在哪裡拍的？", options: ["劍湖山遊樂園", "兒童新樂園", "六福村"], ans: 1 },
        { q: "照片中的地方是哪裡？", options: ["國立傳統藝術中心", "羅東林業文化園區", "蘭陽博物館"], ans: 0 },
        { q: "請問這是哪一年的跨年？", options: ["2023->2024", "2024->2025", "2025->2026"], ans: 1 },
        { q: "這張照片中，彥勳當時穿的褲子是甚麼顏色？", options: ["黑色", "藍色", "灰色"], ans: 2 },
        { q: "這家餐廳叫甚麼名字？", options: ["PaPaPaPasta", "PaPaPasta", "PaPasta"], ans: 1 },
        { q: "這家拍貼機位於哪裡？", options: ["一中街", "逢甲夜市", "文昌街"], ans: 0 },
        { q: "靜怡不開心之後，彥勳點了甚麼給她吃？", options: ["起司塔", "肉桂捲", "草莓蛋糕"], ans: 1 },
        { q: "我們這天晚餐吃甚麼？", options: ["原夜市鴨肉麵", "穗稻忠武", "硬派主廚的軟嫩料理"], ans: 1 },
        { q: "這張照片是在哪拍的？", options: ["海山里", "美山里", "鹽水里"], ans: 0 },
        { q: "我們住的這家飯店叫甚麼呢？", options: ["Hotel Grand Bach", "Hotel Ueno", "Hotel Wing"], ans: 2 },
        { q: "拍照的時候距離彥勳燙完頭髮隔幾天？", options: ["隔兩天", "隔一天", "隔零天"], ans: 2 },
        { q: "彥勳在這家帽子店買了幾頂帽子？", options: ["兩頂", "一頂", "零頂"], ans: 2 },
        { q: "這家店位於東京的哪裡？", options: ["池袋", "上野", "澀谷"], ans: 1 },
        { q: "這家敘敘苑是哪裡的分店？", options: ["上野", "新宿", "原宿"], ans: 1 },
        { q: "彥勳在東京迪士尼買了幾頂頭飾？", options: ["兩頂", "一頂", "零頂"], ans: 0 },
        { q: "我們在築地吃了哪家壽司？", options: ["壽司三味", "壽司清", "壽司大"], ans: 1 },
        { q: "這家超好吃的漢堡叫甚麼？", options: ["SHAKE SHACK", "SHAKE SHAKE", "SHACK SHAKE"], ans: 0 },
        { q: "這是靜怡實習的第幾天？", options: ["Day7", "Day6", "Day5"], ans: 2 }
    ];

    const quizData = rawQuizData.map((item, index) => {
        return { ...item, qImg: `img/q${index + 1}.jpg` };
    });

    let currentQ = 0;
    let errorTimeout;

    function startQuiz() {
        document.getElementById('start-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const data = quizData[currentQ];
        document.getElementById('question').innerText = `Q${currentQ + 1}: ${data.q}`;
        document.getElementById('result-area').classList.add('hidden');
        document.getElementById('options-container').classList.remove('hidden');
        document.getElementById('error-hint').classList.remove('show-error');
        document.getElementById('progress').style.width = "0%";
        const qImgTag = document.getElementById('question-img');
        qImgTag.src = data.qImg;
        const container = document.getElementById('options-container');
        container.innerHTML = ""; 
        data.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });
    }

    function checkAnswer(index) {
        const data = quizData[currentQ];
        if (index === data.ans) {
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('question-img').classList.add('hidden');
            document.getElementById('error-hint').classList.remove('show-error');
            document.getElementById('result-area').classList.remove('hidden');
            setTimeout(() => { document.getElementById('progress').style.width = "100%"; }, 50);
            setTimeout(() => {
                currentQ++;
                if (currentQ < quizData.length) {
                    showQuestion();
                    document.getElementById('question-img').classList.remove('hidden');
                } else {
                    showFinal();
                }
            }, 2500);
        } else {
            const errorHint = document.getElementById('error-hint');
            errorHint.classList.add('show-error');
            clearTimeout(errorTimeout);
            errorTimeout = setTimeout(() => { errorHint.classList.remove('show-error'); }, 2000);
        }
    }

    // --- 幻燈片與特效邏輯 ---
    const finalPhotos = ["img/f1.jpg", "img/f2.jpg", "img/f3.jpg", "img/f4.jpg", "img/f5.jpg"];
    let photoIndex = 0;

    function showFinal() {
        document.getElementById('quiz-section').classList.add('hidden');
        const card = document.getElementById('main-card');
        card.classList.add('glass-mode');
        document.getElementById('final-title').style.color = "white";
        
        const container = document.getElementById('slideshow-container');
        const overlay = document.getElementById('slideshow-overlay');
        container.style.display = 'block';
        overlay.style.display = 'block';

        finalPhotos.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'slide' + (index === 0 ? ' active' : '');
            div.style.backgroundImage = `url('${src}')`;
            container.appendChild(div);
        });

        document.getElementById('memory-machine').classList.remove('hidden');

        // 噴錢特效啟動
        fireConfetti();

        setInterval(changeBg, 4000); 
    }

    function changeBg() {
        const slides = document.querySelectorAll('.slide');
        if (slides.length === 0) return;
        slides[photoIndex].classList.remove('active');
        photoIndex = (photoIndex + 1) % slides.length;
        slides[photoIndex].classList.add('active');
    }

    function fireConfetti() {
        var end = Date.now() + (3 * 1000);
        var colors = ['#FFD700', '#FFA500', '#ff7675']; // 金幣與粉色系

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: colors
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: colors
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>
</body>
</html>
