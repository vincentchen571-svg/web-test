<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 3rd Anniversary ❤️</title>
    <style>
        :root { --primary-color: #ff7675; --bg-color: #fff5f5; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #main-card { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; margin: 8px; border-radius: 12px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; }
        .hidden { display: none; }
        .answer-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 15px; margin: 15px 0; border: 2px solid #eee; }
        #feedback { color: #d63031; font-weight: bold; margin-top: 10px; }
        .loading-bar { height: 4px; background: #fab1a0; width: 0%; margin-top: 10px; transition: width 2s linear; }
    </style>
</head>
<body>

<div id="main-card">
    <div id="start-section">
        <h2 style="font-size: 24px;">Hi 寶貝！❤️<br>三週年問答挑戰挑戰</h2>
        <p>答對後會自動進入下一題喔！</p>
        <button class="btn" onclick="startQuiz()">點我開始</button>
    </div>

    <div id="quiz-section" class="hidden">
        <h2 id="question">題目載入中...</h2>
        <img id="question-img" class="answer-img hidden" src="">
        
        <div id="options-container"></div>

        <div id="result-area" class="hidden">
            <p id="feedback"></p>
            <img id="success-img" class="answer-img" src="">
            <div id="progress" class="loading-bar"></div>
            <p style="font-size: 12px; color: #aaa;">即將進入下一題...</p>
        </div>
    </div>

    <div id="memory-machine" class="hidden">
        <h1 style="color: #d63031;">Happy 3rd Anniversary!</h1>
        <p>這三年有妳，每天都是驚喜。</p>
        <img src="img/final.jpg" class="answer-img" style="display:block;">
    </div>
</div>

<script>
    const quizData = [
        {
            q: "這張照片是在哪裡拍的？",
            qImg: "img/q1.jpg", // 題目要顯示的照片
            options: ["淡水", "九份", "上野"],
            ans: 2,
            sImg: "img/s1.jpg", // 答對後顯示的照片
            msg: "✅ 沒錯！就是上野公園，那天妳好漂亮。"
        },
        {
            q: "我們交往的第一個紀念日吃了什麼？",
            qImg: "", // 若這題不想顯示題目圖，留空即可
            options: ["燒肉", "火鍋", "義大利麵"],
            ans: 0,
            sImg: "img/s2.jpg",
            msg: "✅ 居然還記得！那家燒肉真的超好吃的。"
        }
    ];

    let currentQ = 0;

    function startQuiz() {
        document.getElementById('start-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const data = quizData[currentQ];
        document.getElementById('question').innerText = data.q;
        document.getElementById('result-area').classList.add('hidden');
        document.getElementById('options-container').classList.remove('hidden');
        document.getElementById('progress').style.width = "0%";

        // 處理題目照片
        const qImgTag = document.getElementById('question-img');
        if(data.qImg) {
            qImgTag.src = data.qImg;
            qImgTag.classList.remove('hidden');
        } else {
            qImgTag.classList.add('hidden');
        }

        const container = document.getElementById('options-container');
        container.innerHTML = ""; 
        data.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });
    }

    function checkAnswer(index) {
        const data = quizData[currentQ];
        if (index === data.ans) {
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('question-img').classList.add('hidden'); // 答對後藏起題目圖
            document.getElementById('result-area').classList.remove('hidden');
            
            document.getElementById('feedback').innerText = data.msg;
            document.getElementById('success-img').src = data.sImg;
            
            // 啟動進度條動畫
            setTimeout(() => { document.getElementById('progress').style.width = "100%"; }, 50);

            // 2.5秒後自動下一題
            setTimeout(() => {
                currentQ++;
                if (currentQ < quizData.length) {
                    showQuestion();
                } else {
                    showFinal();
                }
            }, 2500);
        } else {
            alert("答錯啦！再試一次？");
        }
    }

    function showFinal() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('memory-machine').classList.remove('hidden');
    }
</script>
</body>
</html>

</body>
</html>
